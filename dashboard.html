<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Junction Monitor | Traffic Control</title>
  <link rel="stylesheet" href="/dashboard.css">
  <script src="/dashboard.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
        <span>Traffic Control</span>
      </div>
      <span class="feed" id="feed" role="status">Connecting</span>
    </div>
  </header>

  <main>
    <div class="page-heading">
      <h1>Junction monitor</h1>
      <p class="metadata">
        <span id="coordinator">Connecting to coordinator…</span>
        <span id="timing" hidden></span>
      </p>
    </div>

    <section class="metrics" aria-label="Junction totals">
      <div class="metric">
        <span class="metric-label">Queued vehicles</span>
        <strong class="metric-value" id="waiting">—</strong>
      </div>
      <div class="metric metric-crossing">
        <span class="metric-label">Crossing now</span>
        <div class="crossing-value">
          <strong class="metric-value" id="crossing">—</strong>
          <span id="crossing-route"></span>
        </div>
      </div>
      <div class="metric">
        <span class="metric-label">Completed crossings</span>
        <strong class="metric-value" id="total">—</strong>
      </div>
    </section>

    <div class="layout">
      <section class="panel intersection" aria-labelledby="intersection-title">
        <div class="panel-heading">
          <h2 id="intersection-title">Live intersection</h2>
          <span class="phase" id="phase">Waiting for data</span>
        </div>
        <canvas id="map" width="1680" height="928" role="img"
          aria-label="Top-down map with Lane A to the west, B to the east, and C to the south. Lane status lists each vehicle’s destination."></canvas>
        <div class="legend">
          <span><i class="legend-car" aria-hidden="true"></i>Queued vehicle</span>
          <span><i class="legend-route" aria-hidden="true"></i>Active route</span>
          <span><i class="legend-signal" aria-hidden="true"></i>Green signal</span>
          <span><i class="legend-signal red" aria-hidden="true"></i>Red signal</span>
        </div>
      </section>

      <aside class="panel lane-panel" aria-labelledby="lanes-title">
        <div class="panel-heading"><h2 id="lanes-title">Lane status</h2></div>
        <div id="lanes"><p class="empty lane-empty">Waiting for lane data</p></div>
      </aside>

      <section class="panel history" aria-labelledby="history-title">
        <div class="panel-heading"><h2 id="history-title">Recent crossings</h2></div>
        <ul id="recent" class="recent-list" aria-label="Completed vehicle routes">
          <li class="empty">No crossings yet</li>
        </ul>
      </section>
    </div>
  </main>
</body>
</html>
